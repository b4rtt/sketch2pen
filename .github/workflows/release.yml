name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build, e.g. v1.0.0
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: macos-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun test
      - name: Check the tag matches package.json
        run: |
          VERSION=$(bun -e 'console.log(require("./package.json").version)')
          if [[ "$TAG" != "v$VERSION" ]]; then
            echo "::error::tag $TAG does not match package.json version $VERSION"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Build
        run: bun run build
      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="$VERSION" '/^## / { if (found) exit; if ($2 == v) { found = 1; next } } found { print }' CHANGELOG.md > notes.md
          test -s notes.md || echo "sketch2pen $VERSION" > notes.md
          cat notes.md
      - uses: actions/upload-artifact@v4
        with:
          name: sketch2pen-${{ env.VERSION }}
          path: dist/release/*
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/release/* --clobber
          else
            gh release create "$TAG" dist/release/* --title "sketch2pen $VERSION" --notes-file notes.md --verify-tag
          fi
